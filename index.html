<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillMate</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
</head>
<body>
    <div>
        <h1>คำนวณค่าน้ำค่าไฟ</h1>

        <label>ค่าบริการ</label>
        <input
            type="number"
            id="service"
            min="1"
            required
        ><br>
        <label>ค่าห้อง</label>
        <input
            type="number"
            id="room"
            min="1"
            required
        ><br>
        <label>ค่าน้ำจดครั้งก่อน</label>
        <input
            type="number"
            id="waterbefore"
            min="1"
            required
        >
        <label>ค่าน้ำจดครั้งหลัง</label>
        <input
            type="number"
            id="waterafter"
            min="1"
            required
        ><br>
        <label>ค่าไฟจดครั้งก่อน</label>
        <input
            type="number"
            id="electricbefore"
            min="1"
            required
        >
        <label>ค่าไฟจดครั้งหลัง</label>
        <input
            type="number"
            id="electricafter"
            min="1"
            required
        ><br>
        <input
            type="submit"
            value="คำนวณ"
            id="submit"
            onclick="calculate()"
        >
        <a href="./index.html">
            <button>รีเซ็ท</button>
        </a>


        <table id="table">
            <tr>
                <th>ค่าบริการ</th>
                <th>ค่าน้ำ</th>
                <th>ค่าไฟ</th>
                <th>ค่าห้อง</th>
                <th>ราคา</th>
            </tr>
        </table>
    </div>
</body>
</html>
